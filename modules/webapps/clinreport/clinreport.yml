title: ClinReport
version: 3.0.2
type: webapp
description: Review variants marked in the Note column and generate clinical .docx reports (DZM, FND, LPWGS 10x).
requires_opencravat: '>=2.2.9'
pypi_dependency:
- docxtpl
developer:
  name: ''
  organization: ''
  email: ''
  website: ''
  citation: ''
release_note:
  1.0.0: Review window of the ClinReport desktop app as an OpenCRAVAT webapp.
  1.1.0: The database connection is the server's (CLINREPORT_DB_* only); Настройки has no database fields.
  1.2.0: «Выгрузить в базу» records who uploaded and an upload id per press (office «Выгруженные варианты»).
  1.3.0: The lab's own report templates («Шаблоны», checked against an example report); desktop edition without the database.
  3.0.0: Part of ClinReport 3.0.0; the module version now follows the product version.
  3.0.2: Reads the Note column of OpenCRAVAT 2.3.1 and newer (base__note_variant); a missing package no longer stops
    the OpenCRAVAT GUI.
tags:
- reporters
- clinical relevance
