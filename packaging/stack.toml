# The pinned stack of the desktop app; packaging/build.py reads it and records it in bundle.json.

# python-build-standalone release and the full CPython version taken from it (checksum-verified).
python = "3.13.16"
pbs_release = "20261013"

opencravat = "3.2.3"

# Base modules (hg38, wgnote, excelreporter) from KarchinLab/open-cravat-modules-karchinlab at this commit.
karchinlab_modules_ref = "992de73a90f87ff1c0d0b6fab9767fd24fd6b36c"
base_modules = ["mappers/hg38", "webviewerwidgets/wgnote", "reporters/excelreporter"]

# GitHub repository whose v* releases the in-app update check reads; empty = off.
update_repo = "emijks/clinreport"

# Oldest macOS the app runs on, per architecture: build.py re-fetches wheels built for newer systems, checks every
# Mach-O file in the bundle against it and writes it into Info.plist (LSMinimumSystemVersion).
[macos_minimum]
x64 = "10.15"
arm64 = "11.0"

# Windows: WeasyPrint's official standalone build (Pango included) makes the PDFs of the HTML templates; build.py puts
# onedir/weasyprint/ into <bundle>/weasyprint/ and the launcher points CLINREPORT_WEASYPRINT at it. Same release as
# packaging/requirements.txt `weasyprint==` (Linux, server), so every PDF comes from one engine (tested).
[weasyprint_windows]
version = "70.0"
url = "https://github.com/Kozea/WeasyPrint/releases/download/v70.0/weasyprint-windows-onedir.zip"
sha256 = "ab1151f210b4e6bb7aa7a79e91a67e8ddb760094c107bfda55241b6aaefe7d53"
