# The pinned stack of the desktop app; packaging/build.py reads it and records it in bundle.json.

# python-build-standalone release and the full CPython version taken from it (checksum-verified).
python = "3.13.16"
pbs_release = "20261013"

opencravat = "3.2.3"

# Base modules (hg38, wgnote, excelreporter) from KarchinLab/open-cravat-modules-karchinlab at this commit.
karchinlab_modules_ref = "992de73a90f87ff1c0d0b6fab9767fd24fd6b36c"
base_modules = ["mappers/hg38", "webviewerwidgets/wgnote", "reporters/excelreporter"]

# GitHub repository whose v* releases the in-app update check reads; empty = off.
update_repo = "emijks/clinreport"
