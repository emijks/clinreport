name: Release

# Push a tag vX.Y.Z (or vX.Y.Z-rc1 for a pre-release) whose X.Y.Z equals pyproject.toml's version.
# workflow_dispatch builds everything as <pyproject version>-manual.<run> and publishes nothing (a dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          PROJECT=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "${VERSION%%-*}" != "$PROJECT" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $PROJECT"
              exit 1
            fi
          else
            VERSION="$PROJECT-manual.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  checks:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  extension:
    name: Extension zip
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          staging="dist/clinreport-extension-$VERSION"
          mkdir -p "$staging"
          cp packaging/install_extension.py "$staging/"
          cp -r modules "$staging/modules"
          rm -f "$staging/modules/ruff.toml"
          find "$staging" -name __pycache__ -prune -exec rm -rf {} +
          (cd dist && zip -qr "clinreport-extension-$VERSION.zip" "clinreport-extension-$VERSION")
      # Archived on purpose: download-artifact unpacks an unarchived .zip, and the release would find no zip to attach.
      - uses: actions/upload-artifact@v7
        with:
          name: clinreport-extension-${{ needs.version.outputs.version }}
          path: dist/clinreport-extension-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [version, checks, extension]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Every artifact of this run: the installers (uploaded unzipped), the extension zip (in an archive), coverage.xml.
      # The release globs below search subfolders, wherever download-artifact puts unzipped files.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          base="${VERSION%%-*}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$base" '
              /^## / { if (found) exit; if (index($0, "[" v "]") || $2 == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > notes.md
          fi
          [ -s notes.md ] || echo "ClinReport $VERSION" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: ClinReport ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
          fail_on_unmatched_files: true
